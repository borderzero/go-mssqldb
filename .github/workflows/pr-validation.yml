name: pr-validation

# Inherited from upstream microsoft/go-mssqldb. It runs the full driver test
# suite against live SQL Server containers and fails on this fork for reasons
# unrelated to our proxy changes, so it no longer runs on pull requests.
# Trigger it manually from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.19','1.20']
        sqlImage: ['2019-latest','2022-latest']
    steps:
    - uses: actions/checkout@v2
    - name: Setup go
      uses: actions/setup-go@v2
      with:
        go-version: '${{ matrix.go }}'
    - name: Run tests against Linux SQL
      run: |
        go version
        export SQLCMDPASSWORD=$(date +%s|sha256sum|base64|head -c 32)
        export SQLCMDUSER=sa
        export SQLUSER=sa
        export SQLPASSWORD=$SQLCMDPASSWORD
        export DATABASE=master
        docker run -m 2GB -e ACCEPT_EULA=1 -d --name sqlserver -p:1433:1433 -e SA_PASSWORD=$SQLCMDPASSWORD mcr.microsoft.com/mssql/server:${{ matrix.sqlImage }}
        sleep 10
        go test -v ./...
